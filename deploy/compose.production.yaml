name: apex-facilities-production

services:
  database:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APEX_DB_NAME:-apex_facilities}
      POSTGRES_USER: ${APEX_DB_ADMIN_USER:-apex_admin}
      POSTGRES_PASSWORD: ${APEX_DB_ADMIN_PASSWORD:?Set APEX_DB_ADMIN_PASSWORD in .env.production}
    volumes:
      - apex_postgres_data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    mem_limit: ${APEX_DB_MEMORY_LIMIT:-2g}
    cpus: 2.0

  migrations:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: ${APEX_DB_NAME:-apex_facilities}
      PGUSER: ${APEX_DB_ADMIN_USER:-apex_admin}
      PGPASSWORD: ${APEX_DB_ADMIN_PASSWORD:?Set APEX_DB_ADMIN_PASSWORD in .env.production}
    volumes:
      - ../database/migrations:/migrations:ro
      - ./database/run-migrations.sh:/usr/local/bin/run-migrations:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/run-migrations"]
    depends_on:
      database:
        condition: service_healthy
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 256m
    cpus: 0.5

  preview-workspace:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: ${APEX_DB_NAME:-apex_facilities}
      PGUSER: ${APEX_DB_ADMIN_USER:-apex_admin}
      PGPASSWORD: ${APEX_DB_ADMIN_PASSWORD:?Set APEX_DB_ADMIN_PASSWORD in .env.production}
      APEX_PREVIEW_ALIAS: ${APEX_PREVIEW_ALIAS:?Set APEX_PREVIEW_ALIAS in .env.production}
      APEX_PREVIEW_PASSWORD: ${APEX_PREVIEW_PASSWORD:?Set APEX_PREVIEW_PASSWORD in .env.production}
    volumes:
      - ./database/provision-preview.sh:/usr/local/bin/provision-preview:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/provision-preview"]
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 128m
    cpus: 0.25

  app:
    build:
      context: ..
      dockerfile: deploy/app/Dockerfile
    restart: unless-stopped
    environment:
      APEX_DB_HOST: database
      APEX_DB_PORT: "5432"
      APEX_DB_NAME: ${APEX_DB_NAME:-apex_facilities}
      APEX_PREVIEW_ALIAS: ${APEX_PREVIEW_ALIAS:?Set APEX_PREVIEW_ALIAS in .env.production}
      APEX_PREVIEW_PASSWORD: ${APEX_PREVIEW_PASSWORD:?Set APEX_PREVIEW_PASSWORD in .env.production}
    depends_on:
      database:
        condition: service_healthy
      preview-workspace:
        condition: service_completed_successfully
    expose:
      - "8501"
    networks:
      - web
      - data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/.streamlit:size=1m,mode=0700,uid=10001,gid=10001
    mem_limit: ${APEX_APP_MEMORY_LIMIT:-1g}
    cpus: 1.0

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APEX_WEB_DOMAIN: ${APEX_WEB_DOMAIN:?Set APEX_WEB_DOMAIN in .env.production}
      APEX_DB_DOMAIN: ${APEX_DB_DOMAIN:-db.invalid}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - acme_webroot:/srv/acme:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: ${APEX_CADDY_MEMORY_LIMIT:-256m}
    cpus: 0.5

networks:
  web:
  data:
    internal: true

volumes:
  apex_postgres_data:
  caddy_data:
  caddy_config:
  acme_webroot:
