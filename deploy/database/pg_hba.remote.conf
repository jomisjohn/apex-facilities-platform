# Local administrative automation uses the shared Unix socket and SCRAM.
local     all              all                               scram-sha-256

# Remote and internal TCP clients must use TLS. Only provisioned workspace
# members may connect to the Apex teaching database.
hostssl   apex_facilities  +apex_workspace_member  0.0.0.0/0  scram-sha-256
hostssl   apex_facilities  +apex_workspace_member  ::0/0       scram-sha-256

# Make the fail-closed behavior explicit for every other TCP attempt.
hostnossl all              all                     0.0.0.0/0  reject
hostnossl all              all                     ::0/0       reject
hostssl   all              all                     0.0.0.0/0  reject
hostssl   all              all                     ::0/0       reject
