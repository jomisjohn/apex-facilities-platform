[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "database: requires APEX_TEST_DATABASE_URL for a non-admin student login",
    "fallback: requires the local Apex database and an ignored .env file",
]

[tool.ruff]
target-version = "py310"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "B"]
